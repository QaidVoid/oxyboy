# Pokemon Emerald (BPEE) analysis config: names and seeds recovered
# from the boot path. Use with any analysis-driven command:
#
#   oxyboy lift --rom corpus/Pokemon\ -\ Emerald\ Version\ \(USA,\ Europe\).gba \
#       --c --config configs/emerald.conf
#
# crt0 writes IntrMain's address into the IRQ handler pointer at
# 0x03007FFC with `add r0, pc, #0x20` at 0x08000220 (0x08000248, ARM
# state); the SDK relocates a copy to IWRAM at runtime, but the ROM
# copy is the one worth lifting. Discovery never walks a call to it
# (the vector is written, not called), so it is seeded here. The
# thumb helper at 0x080003A4 is the init call crt0 reaches through
# `ldr r1, [pc, #0x14]; bx r1` at 0x08000230.
arm_func 0x08000248 intrmain
thumb_func 0x080003a4 agb_init_helper
