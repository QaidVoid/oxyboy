[workspace]
resolver = "3"
members = [
    "crates/analysis",
    "crates/cli",
    "crates/decode",
    "crates/emit",
    "crates/ir",
    "crates/recomp",
    "crates/rom",
    "crates/runtime",
    "crates/testutil",
    "crates/trace",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"
repository = "https://github.com/QaidVoid/oxyboy"
# Released as a binary on GitHub rather than to a registry.
publish = false
